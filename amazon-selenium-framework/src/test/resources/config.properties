# ==============================================
# Environment / Application configuration
# ==============================================
baseUrl=https://www.amazon.in/

# Browser: chrome | firefox | edge
browser=chrome

# Run browser headless (true/false)
headless=false

# Timeouts (in seconds)
implicitWait=5
explicitWait=15
pageLoadTimeout=30

# Maximize browser window on launch
maximizeWindow=true

# Excel test-data file (relative to src/test/resources)
excelDataFile=testdata/SearchTestData.xlsx
